<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>myon-bioinformatics — Portfolio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>myon-bioinformatics</h1>
      <div class="header-actions">
        <nav class="nav">
          <a href="https://github.com/myon-bioinformatics" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="https://lit.link/myon123" target="_blank" rel="noopener noreferrer">lit.link</a>
          <a href="https://linktr.ee/myon123" target="_blank" rel="noopener noreferrer">Linktree</a>
        </nav>
        <div class="view-mode-switch">
          <label for="view-mode-select">Mode</label>
          <select id="view-mode-select" aria-label="Display mode">
            <option value="modern">Modern</option>
            <option value="xml-like">XML-like</option>
            <option value="json">JSON</option>
            <option value="markdown">Markdown</option>
            <option value="github-like">GitHub-like</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="container intro">
      <h2 data-tag="hello">👋 Hello</h2>
      <p>Bioinformatics → Security/Backend engineer. I build practical GUI/CLI tools in Python, plus Go/TypeScript.</p>
    </section>

    <section id="profile" class="container">
      <h2 data-tag="profile">🧑‍💻 Profile</h2>
      <div class="tabs" role="tablist" aria-label="Profile sections">
        <button class="tab-btn active" role="tab" aria-selected="true"  aria-controls="panel-about"  id="tab-about">About</button>
        <button class="tab-btn"        role="tab" aria-selected="false" aria-controls="panel-skills" id="tab-skills">Skills</button>
        <button class="tab-btn"        role="tab" aria-selected="false" aria-controls="panel-career" id="tab-career">Career</button>
      </div>
      <div id="panel-about"  class="tab-panel active" role="tabpanel" aria-labelledby="tab-about"></div>
      <div id="panel-skills" class="tab-panel"        role="tabpanel" aria-labelledby="tab-skills" hidden></div>
      <div id="panel-career" class="tab-panel"        role="tabpanel" aria-labelledby="tab-career" hidden></div>
    </section>

    <section id="projects" class="container">
      <h2 data-tag="projects">🚀 Projects</h2>
      <div id="project-grid" class="grid"></div>
      <p class="more">
        More on <a href="https://github.com/myon-bioinformatics" target="_blank" rel="noopener noreferrer">GitHub</a>
      </p>
    </section>

    <section class="container outro">
      <h2 data-tag="contact">📬 Contact</h2>
      <p>Twitter: <a href="https://twitter.com/myonitbusiness" target="_blank" rel="noopener noreferrer">@myonitbusiness</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© myon-bioinformatics</small>
    </div>
  </footer>

  <script src="./index.js"></script>
</body>
</html>
