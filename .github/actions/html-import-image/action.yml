name: HTML import test image
description: Reuse browser and OS dependency layers for local and published acceptance tests.
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Build and load the test image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        file: Dockerfile.html-import
        load: true
        tags: html-import-test
        cache-from: type=gha,scope=html-import-test
        # Only main push builds publish shared cache; PR and workflow_run builds read it.
        # max retains browser and Python dependency stages even when site sources change.
        cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=html-import-test,mode=max,ignore-error=true' || '' }}
