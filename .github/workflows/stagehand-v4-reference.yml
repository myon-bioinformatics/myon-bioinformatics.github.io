name: Stagehand v4 dual-SDK reference

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@2192ff22acafdd09e80ac722df91ee937aaedd5e

  node:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run stagehand:surface

  python:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m pytest -v tests/test_stagehand_v4_python.py --junitxml=reports/stagehand-python.xml

      - name: Preserve raw pytest JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-stagehand-python-py3.12
          path: reports/stagehand-python.xml
          if-no-files-found: error
          retention-days: 14

  metadata:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install -r tests/requirements.txt
      - run: npm ci --ignore-scripts
      - run: python scripts/myon_bioinformatics_github_io_tooling_meta.py > stagehand-v4-tooling-meta.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stagehand-v4-tooling-meta
          path: stagehand-v4-tooling-meta.json
          retention-days: 14


  screenshots:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Serve site locally
        run: python3 -m http.server 8000 > /tmp/github-io-http.log 2>&1 &

      - name: Wait for server
        run: |
          python3 - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8000/index.html"
          for attempt in range(50):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  if attempt == 49:
                      raise
                  time.sleep(0.1)
          PY

      - name: Capture desktop screenshot
        run: |
          npx playwright screenshot             --browser=chromium             --viewport-size="1440,900"             http://127.0.0.1:8000/index.html             github-io-desktop-1440x900.png

      - name: Capture mobile screenshot
        run: |
          npx playwright screenshot             --browser=chromium             --viewport-size="390,844"             http://127.0.0.1:8000/index.html             github-io-mobile-390x844.png

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-io-screenshots
          path: github-io-*.png
          retention-days: 14

  failure-identity:
    needs: [changes, python]
    if: (always()) && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@2192ff22acafdd09e80ac722df91ee937aaedd5e
    with:
      expected-reports: '["junit-stagehand-python-py3.12/stagehand-python.xml"]'
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      output-artifact: stagehand-python-failure-identity
