name: Stagehand v4 dual-SDK reference

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm run stagehand:surface

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m pytest -v tests/test_stagehand_v4_python.py

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r tests/requirements.txt
      - run: npm install --ignore-scripts
      - run: python scripts/tooling_meta.py > stagehand-v4-tooling-meta.json
      - uses: actions/upload-artifact@v4
        with:
          name: stagehand-v4-tooling-meta
          path: stagehand-v4-tooling-meta.json
          retention-days: 14
