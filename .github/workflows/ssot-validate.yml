name: Validate shared canonical data

on:
  pull_request:
    paths:
      - "profile.json"
      - "projects.json"
      - "services.json"
      - "api/repos.json"
      - "scripts/validate-ssot.mjs"
      - "docs/SSOT.md"
      - ".github/workflows/ssot-validate.yml"
  push:
    paths:
      - "profile.json"
      - "projects.json"
      - "services.json"
      - "api/repos.json"
      - "scripts/validate-ssot.mjs"
      - "docs/SSOT.md"
      - ".github/workflows/ssot-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ssot-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Validate SSOT relationships
        run: node scripts/validate-ssot.mjs
