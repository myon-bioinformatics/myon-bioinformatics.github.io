name: Validate shared canonical data

on:
  pull_request:
    paths:
      - "profile.json"
      - "projects.json"
      - "services.json"
      - "api/repos.json"
      - "scripts/validate-ssot.mjs"
      - "docs/SSOT.md"
      - ".github/workflows/ssot-validate.yml"
  push:
    paths:
      - "profile.json"
      - "projects.json"
      - "services.json"
      - "api/repos.json"
      - "scripts/validate-ssot.mjs"
      - "docs/SSOT.md"
      - ".github/workflows/ssot-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ssot-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate SSOT relationships
        run: node scripts/validate-ssot.mjs
