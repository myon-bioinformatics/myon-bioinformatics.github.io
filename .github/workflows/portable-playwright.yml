name: Portable Playwright runners
on:
  pull_request:
    paths:
      - 'tools/portable_playwright.py'
      - 'tools/portable_playwright.mjs'
      - 'tools/portable_playwright_config.cjs'
      - 'tests/test_portable_playwright.py'
      - 'tests/portable-playwright.node.test.mjs'
      - '.github/workflows/portable-playwright.yml'
  workflow_dispatch:
jobs:
  node-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Node standard-library tests
        run: node --test tests/portable-playwright.node.test.mjs
  python-and-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python standard-library and cross-runtime tests
        run: python -m unittest discover -s tests -p test_portable_playwright.py -v
