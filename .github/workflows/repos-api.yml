name: Update repos API

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build_repos_api.py
      - .github/workflows/repos-api.yml
      # Exercise the refresh-to-publication handoff when its configuration changes.
      - .github/workflows/jekyll-gh-pages.yml

permissions:
  contents: write

concurrency:
  group: repos-api
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false

      - name: Build api/repos.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          python tools/build_repos_api.py --owner myon-bioinformatics --output api/repos.json

      - name: Commit refreshed API when it changed
        run: |
          if [ -z "$(git status --porcelain -- api/repos.json .nojekyll)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/repos.json .nojekyll
          git commit -m "chore: refresh repos API"
          git push
