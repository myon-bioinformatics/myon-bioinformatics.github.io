# Daily: refresh api/repos.json. The name is what pages.yml waits on, so it stays.
name: Update repos API

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 JST
  push:
    branches: [main]
    paths:
      - scripts/repos_catalog.py
      - .github/workflows/repos-api.yml
      # Exercise the refresh-to-publication handoff when its configuration changes.
      - .github/workflows/pages.yml

permissions:
  contents: write

concurrency:
  group: repos-api
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 🔒 keep the token out of .git/config (pushed explicitly below).
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        # Preserve the former setup-python 3.x lane. Without managed-only
        # selection, uv may satisfy "3" with an older runner Python.
        env:
          UV_PYTHON_PREFERENCE: only-managed
        with:
          version: "latest"
          python-version: "3"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true

      - name: Build api/repos.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          python scripts/repos_catalog.py --owner myon-bioinformatics --output api/repos.json

      - name: Commit the refreshed API when it changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(api/repos.json .nojekyll)
          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            exit 0
          fi
          message="chore: refresh repos API"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "$message"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
