name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@main

  static:
    timeout-minutes: 30
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      # 🔌 The lab whose code the chat's MCP server runs (tests read it here as the page reads media/chat/lab/; one pin for both jobs).
      - name: Checkout the verified mcp-toolcall-lab source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/mcp-toolcall-lab
          ref: main
          path: .test-deps/mcp-toolcall-lab
          persist-credentials: false
      - name: Validate portal links
        run: uv run --locked --only-group test python -m pytest tests --junitxml=reports/portal.xml

      - name: Preserve raw pytest JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-portal-py3.15
          path: reports/portal.xml
          if-no-files-found: error
          retention-days: 14

  browser:
    timeout-minutes: 30
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      # Browser tests are Python Playwright in this active venv; each stages the site (source tree + generated files) itself.
      # The HTML import spec runs in the Docker contract (html-import.yml), on Chromium and WebKit.
      # 🔌 The lab whose code the chat's MCP server runs (tests read it here as the page reads media/chat/lab/; one pin for both jobs).
      - name: Checkout the verified mcp-toolcall-lab source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/mcp-toolcall-lab
          ref: main
          path: .test-deps/mcp-toolcall-lab
          persist-credentials: false
      - name: Install locked Python Playwright
        run: uv sync --locked --only-group browser
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      # 🧬 Catalog, search and topics, display modes, colour themes, AI highlights, brand.
      - name: Check the front page in Chromium
        run: python -m pytest tests/test_front_page.py tests/test_maps.py -q
      # 📱 Manifest, icons, start_url, tool-page shortcuts.
      # Writes test-results/home-screen/home-screen-shortcut-<UTC>.gif, uploaded with the evidence below.
      - name: Check home-screen shortcuts in Chromium
        run: python -m pytest tests/test_site.py -k home_screen -q
      # 💬 Pyodide (jsDelivr) runs scripts/chat.py with the pinned modules; writes test-results/chat/chat-conversation-<UTC>.gif.
      - name: Check the cross-repo chat in Chromium
        run: python -m pytest tests/test_site.py -k chat_in_chromium -q
      - name: Checkout the verified Ironmate Studio source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/Ironmate
          ref: main
          path: .test-deps/ironmate-studio
          persist-credentials: false
      - name: Check routed Image and Slide Studio file operations in Chromium
        run: python -m pytest tests/studio_routes_browser.py -q
      # 🌍 scripts/world.py: Node 26 runs the world.js harnesses the Python tests hold; the browser contract walks every world.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Check the world with Node 26
        run: python -m pytest tests/test_world.py -q
      - name: Check the world in Chromium
        run: python tests/world_browser.py -v
      - name: Preserve screenshots and generated evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-browser-evidence
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: [changes, static]
    if: (always()) && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@main
    with:
      expected-reports: '["junit-portal-py3.15/portal.xml"]'
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      output-artifact: portal-failure-identity
