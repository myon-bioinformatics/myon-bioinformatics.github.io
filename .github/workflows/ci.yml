name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77

  static:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Validate portal links
        run: uv run --locked --only-group test python -m pytest tests --junitxml=reports/portal.xml

      - name: Preserve raw pytest JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-portal-py3.15
          path: reports/portal.xml
          if-no-files-found: error
          retention-days: 14

  browser:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      # capture-evidence.spec.js spawns the Python capture CLI from this active venv.
      - name: Install locked Python capture dependencies
        run: uv sync --locked --only-group browser
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps --no-shell chromium
      - name: Stage site with generated browser assets
        run: |
          python - <<'PYTHON'
          import shutil
          shutil.copytree('.', '.generated-site', ignore=shutil.ignore_patterns('.git', '.generated-site', 'node_modules', 'test-results', '__pycache__'))
          PYTHON
          python scripts/build_web_ui_assets.py --output .generated-site
      - name: Verify transferred browser tools
        run: npx playwright test --config playwright/generated.config.js
      # 📱 Python Playwright (same Chromium revision as above): manifest, icons, start_url, tool-page shortcuts.
      # Writes test-results/home-screen/home-screen-shortcut-<UTC>.gif, uploaded with the evidence below.
      - name: Check home-screen shortcuts in Chromium
        run: python -m pytest tests/test_site.py -k home_screen -q
      - name: Preserve screenshots and generated evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-browser-evidence
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: [changes, static]
    if: (always()) && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77
    with:
      expected-reports: '["junit-portal-py3.15/portal.xml"]'
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      output-artifact: portal-failure-identity
