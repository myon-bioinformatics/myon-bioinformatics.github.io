name: Vendor lock

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendor-lock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-locked:
    name: Vendor locked baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          python-version: "3.15"
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 26c442bc51b8a2837fe2556782b2937f396932af
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify and recreate locked vendor snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py recreate --manifest vendor.lock.json
      - name: Install pinned browser asset generator
        run: uv pip install -r requirements-pages.txt
      - name: Verify generated browser asset hashes
        run: |
          python scripts/build_web_ui_assets.py --output "$RUNNER_TEMP/web-ui-assets"
          python scripts/build_web_ui_assets.py --output "$RUNNER_TEMP/web-ui-assets-repeat"
          diff -r "$RUNNER_TEMP/web-ui-assets" "$RUNNER_TEMP/web-ui-assets-repeat"
