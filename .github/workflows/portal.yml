name: portal

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1

  static:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Validate portal links
        run: python -m pytest tests/test_portal_links.py tests/test_lab_publication.py tests/test_myon_bioinformatics_github_io_vendor_lock.py --junitxml=reports/portal.xml

      - name: Preserve raw pytest JUnit
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: junit-portal-py3.12
          path: reports/portal.xml
          if-no-files-found: error
          retention-days: 14

  browser:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps --no-shell chromium
      - name: Verify transferred browser tools
        run: npx playwright test tests/lab-publication.spec.js

  failure-identity:
    needs: [changes, static]
    if: (always()) && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
    with:
      expected-reports: '["junit-portal-py3.12/portal.xml"]'
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      output-artifact: portal-failure-identity
