name: portal

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Validate portal links
        run: python -m pytest tests/test_portal_links.py tests/test_lab_publication.py --junitxml=reports/portal.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify transferred browser tools
        run: npx playwright test tests/lab-publication.spec.js

      - name: Preserve raw pytest JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-portal-py3.12
          path: reports/portal.xml
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: static
    if: always()
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@e7455cbf69eac4ba776fbeeaf15ba685454fea9a
    with:
      expected-reports: '["junit-portal-py3.12/portal.xml"]'
      output-artifact: portal-failure-identity
