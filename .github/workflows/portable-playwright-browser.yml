name: Portable Playwright browser smoke
on:
  pull_request:
    paths:
      - 'tools/portable_playwright.py'
      - 'tools/portable_playwright.mjs'
      - 'tools/portable_playwright_config.cjs'
      - 'tests/portable-playwright.node.test.mjs'
      - 'tests/test_portable_playwright.py'
      - '.github/workflows/portable-playwright-browser.yml'
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Shared config selects the Chromium channel, which needs the full browser.
      # This job is headless only, so drop that channel and use the headless shell.
      PORTABLE_PW_HEADLESS_SHELL: "1"
    strategy:
      fail-fast: false
      matrix:
        runtime: [python, node]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Python browser smoke
        if: matrix.runtime == 'python'
        run: python -S tools/portable_playwright.py --root . --timeout 600 tests/project-catalog.spec.js
      - name: Node browser smoke
        if: matrix.runtime == 'node'
        run: node tools/portable_playwright.mjs --root . --timeout 600 tests/project-catalog.spec.js
