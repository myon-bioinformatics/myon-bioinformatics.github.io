# Test-only environment. The site itself is static (no Python runtime dependency);
# the stagehand-v4 Python reference needs the `test` group, browser capture adds `browser`.
[project]
name = "myon-bioinformatics-github-io-tests"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# The shared Web UI generator (scripts/project_pages.py), and the single-file modules the 💬 chat page runs in Pyodide
# (scripts/chat.py: markdown.py, ascii_artist.py, cli_args.py, ontautology.py, olnm.py); each commit is pinned once, in
# [tool.uv.sources] below.
pages = ["pysaiyanweboo", "md-market", "ascii-artist-dev", "cli-args-dev", "ontautology", "one-launch-numerous-modules"]
docker-test = ["pytest>=9.1.1", { include-group = "pages" }, "gh-identity-dev"]
test = [{ include-group = "docker-test" }, "stagehand>=4.2.1"]
# 🎥 project_pages.py --record-samples and 🌍 world.py record: the generator, Playwright and Pillow (the GIF encoder).
samples = [{ include-group = "pages" }, "playwright>=1.64.0", "pillow>=13.0.0"]
browser = [{ include-group = "test" }, { include-group = "samples" }]

[tool.uv]
package = false
default-groups = ["test"]

[tool.uv.sources]
pysaiyanweboo = { git = "https://github.com/myon-bioinformatics/PySaiyanWeBoo", rev = "e249a7c33071a5e70ff4866492506ebfd7719875" }
md-market = { git = "https://github.com/myon-bioinformatics/markdown", rev = "f454c175972890aa9d66f63952b5054cac4b726d" }
ascii-artist-dev = { git = "https://github.com/myon-bioinformatics/ascii_artist", rev = "8942ebde6e449c09ff23a8e8fccde3e778e4e809" }
cli-args-dev = { git = "https://github.com/myon-bioinformatics/cli_args", rev = "6305b47c717068d6470a41b8a983247e1cc5d4f8" }
gh-identity-dev = { git = "https://github.com/myon-bioinformatics/gh_identity", rev = "3111c17213baa0f469500a765d0a59f6de8e1d41" }
ontautology = { git = "https://github.com/myon-bioinformatics/OnTautoLogy", rev = "c99c36ff572083df75be5476e84f489198288725" }
one-launch-numerous-modules = { git = "https://github.com/myon-bioinformatics/OneLaunchNumerousModules", rev = "ceade2335042462dc2f22d0af308b27b32039023" }
