# Test-only environment. The site itself is static (no Python runtime dependency);
# the stagehand-v4 Python reference needs the `test` group, browser capture adds `browser`.
[project]
name = "myon-bioinformatics-github-io-tests"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# The shared Web UI generator (scripts/project_pages.py), and the single-file modules the 💬 chat page runs in Pyodide
# (scripts/chat.py: markdown.py, ascii_artist.py, cli_args.py, ontautology.py, olnm.py, Err-o-RoadRunner's triage.py + errlib);
# each commit is pinned once, in [tool.uv.sources] below.
pages = ["pysaiyanweboo", "md-market", "ascii-artist-dev", "cli-args-dev", "ontautology", "one-launch-numerous-modules", "err-o-roadrunner"]
docker-test = ["pytest>=9.1.1", { include-group = "pages" }, "gh-identity-dev"]
test = [{ include-group = "docker-test" }, "stagehand>=4.2.1"]
# 🎥 project_pages.py --record-samples and 🌍 world.py record: the generator, Playwright and Pillow (the GIF encoder).
samples = [{ include-group = "pages" }, "playwright>=1.64.0", "pillow>=13.0.0"]
browser = [{ include-group = "test" }, { include-group = "samples" }]

[tool.uv]
package = false
default-groups = ["test"]

[tool.uv.sources]
pysaiyanweboo = { git = "https://github.com/myon-bioinformatics/PySaiyanWeBoo", branch = "main" }
md-market = { git = "https://github.com/myon-bioinformatics/markdown", branch = "main" }
ascii-artist-dev = { git = "https://github.com/myon-bioinformatics/ascii_artist", branch = "main" }
cli-args-dev = { git = "https://github.com/myon-bioinformatics/cli_args", branch = "main" }
gh-identity-dev = { git = "https://github.com/myon-bioinformatics/gh_identity", branch = "main" }
ontautology = { git = "https://github.com/myon-bioinformatics/OnTautoLogy", branch = "main" }
one-launch-numerous-modules = { git = "https://github.com/myon-bioinformatics/OneLaunchNumerousModules", branch = "main" }
err-o-roadrunner = { git = "https://github.com/myon-bioinformatics/Err-o-RoadRunner", branch = "main" }
