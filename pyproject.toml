# Test-only environment. The site itself is static (no Python runtime dependency);
# the stagehand-v4 Python reference needs the `test` group, browser capture adds `browser`.
[project]
name = "myon-bioinformatics-github-io-tests"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
docker-test = ["pytest>=9.1.1", "pysaiyanweboo", "gh-identity-dev"]
test = [{ include-group = "docker-test" }, "stagehand>=4.2.1"]
browser = [{ include-group = "test" }, "playwright>=1.64.0"]

[tool.uv]
package = false
default-groups = ["test"]

[tool.uv.sources]
pysaiyanweboo = { git = "https://github.com/myon-bioinformatics/PySaiyanWeBoo", rev = "acf53d8f0eee8fff28f9e395c0e02dc65ae4f1e2" }
gh-identity-dev = { git = "https://github.com/myon-bioinformatics/gh_identity", rev = "f9c56ccb7fe73d1d1b4bd62047cee21e4de6d239" }
