# Test-only environment. The site itself is static (no Python runtime dependency);
# the stagehand-v4 Python reference needs the `test` group, browser capture adds `browser`.
[project]
name = "myon-bioinformatics-github-io-tests"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
docker-test = ["pytest>=9.1.1", "pysaiyanweboo"]
test = [{ include-group = "docker-test" }, "stagehand>=4.2.1"]
browser = [{ include-group = "test" }, "playwright>=1.64.0"]

[tool.uv]
package = false
default-groups = ["test"]

[tool.uv.sources]
pysaiyanweboo = { git = "https://github.com/myon-bioinformatics/PySaiyanWeBoo", rev = "f624d9364017b7e2da7f797817dfba2a8d9adb14" }
